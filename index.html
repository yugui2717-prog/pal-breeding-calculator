<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻兽帕鲁配种计算器 v1.1（变异配种）</title>
<style>
  /* ========== 样式区：全局 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-1: #0f1029;
    --bg-2: #1a1b3a;
    --card: #1e2042;
    --card-2: #25274f;
    --line: #3a3d6e;
    --text: #e8eaf6;
    --text-dim: #9ea1c8;
    --orange: #ff7a45;   /* 正向色 */
    --blue: #36c9ff;     /* 反向色 */
    --purple: #b66bff;   /* 变异色 */
    --green: #5dd39e;
    --gold: #ffd24a;
    --danger: #ff5470;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(54,201,255,.12), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(182,107,255,.14), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    min-height: 100vh;
    line-height: 1.6;
    padding: 24px 16px 60px;
  }

  /* ========== 头部 ========== */
  header { text-align: center; margin: 10px auto 28px; max-width: 1100px; }
  header h1 {
    font-size: 30px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--orange), var(--gold), var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 24px rgba(255,210,74,.18);
  }
  header p { color: var(--text-dim); font-size: 14px; margin-top: 6px; }

  /* ========== 布局 ========== */
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } header h1 { font-size: 24px; } }

  /* ========== 卡片 ========== */
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent, var(--line));
  }
  .card.fwd { --accent: var(--orange); }
  .card.rev { --accent: var(--blue); }
  .card.his { --accent: var(--purple); }
  .card h2 { font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .card h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .card .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }

  /* ========== 表单 ========== */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  select {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #15162e; color: var(--text);
    font-size: 15px; cursor: pointer; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.06); }
  optgroup { color: var(--text-dim); font-style: normal; }
  option { color: var(--text); }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: bold; color: #1a1b3a; cursor: pointer;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #fff));
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
    transition: transform .08s, filter .2s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--line); box-shadow: none; }

  /* ========== 结果区 ========== */
  .result { margin-top: 14px; min-height: 60px; }
  .result .empty { color: var(--text-dim); font-size: 13px; padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  .result .warn { color: var(--gold); font-size: 13px; padding: 14px; text-align: center; border: 1px dashed var(--gold); border-radius: 10px; background: rgba(255,210,74,.06); }

  .pal-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,122,69,.10); border: 1px solid var(--orange);
    border-radius: 10px; padding: 10px 14px; margin: 6px 6px 0 0;
  }
  .pal-chip .name { font-weight: bold; }
  .pal-chip .pw { color: var(--gold); font-size: 13px; }
  /* 变异后代 chip：紫色边框 */
  .pal-chip.mut {
    background: rgba(182,107,255,.12); border-color: var(--purple);
    box-shadow: 0 0 12px rgba(182,107,255,.25);
  }
  .pal-chip.mut .pw { color: var(--purple); }

  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: var(--purple); color: #1a1b3a; font-weight: bold; margin-left: 6px;
  }

  .avg-info { color: var(--text-dim); font-size: 13px; margin-top: 10px; }

  .mut-hit {
    margin-top: 8px; padding: 10px 12px; border: 1px solid var(--purple);
    border-radius: 10px; background: rgba(182,107,255,.08);
  }
  .mut-hit .title { color: var(--purple); font-weight: bold; font-size: 14px; margin-bottom: 4px; }

  /* 反向结果：分区与组合列表 */
  .section-title { font-size: 14px; margin: 14px 0 6px; display: flex; align-items: center; gap: 8px; }
  .section-title .cnt { color: var(--gold); font-weight: bold; }
  .combo-list { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow: auto; padding-right: 4px; }
  .combo {
    display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: center; gap: 10px;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
    font-size: 14px;
  }
  .combo.mut { border-color: var(--purple); background: rgba(182,107,255,.07); }
  .combo .p { font-weight: bold; }
  .combo .x { color: var(--text-dim); }
  .combo .pw { color: var(--gold); font-size: 12px; text-align: right; }
  @media (max-width: 480px) { .combo { grid-template-columns: 1fr; gap: 4px; } .combo .x { display: none; } }

  /* ========== 历史 ========== */
  .his-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .his-head h2 { margin: 0; }
  .his-list { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow: auto; }
  .his-item {
    background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; font-size: 13px;
  }
  .his-item .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; margin-right: 6px; font-weight: bold; color: #1a1b3a; }
  .his-item .tag.fwd { background: var(--orange); }
  .his-item .tag.rev { background: var(--blue); }
  .his-item .tag.mut { background: var(--purple); }
  .his-item .time { color: var(--text-dim); float: right; font-size: 11px; }
  .his-item .res { color: var(--gold); }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ========== 留言板 ========== */
  .card.msg { --accent: var(--green); }
  .msg-form { display: grid; gap: 10px; }
  .msg-form textarea {
    width: 100%; min-height: 72px; resize: vertical; padding: 11px 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: #15162e; color: var(--text); font-size: 14px; line-height: 1.6;
    font-family: inherit; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .msg-form textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.06); }
  .msg-form .msg-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }
  .msg-form input {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #15162e; color: var(--text); font-size: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .msg-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.06); }
  .msg-tip { color: var(--text-dim); font-size: 12px; min-height: 16px; }
  .msg-tip.err { color: var(--danger); }
  .msg-tip.ok { color: var(--green); }
  .msg-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; max-height: 460px; overflow: auto; padding-right: 4px; }
  .msg-item {
    background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 13px;
  }
  /* 置顶留言：金色边框 + 发光背景 */
  .msg-item.pinned {
    border-color: var(--gold);
    background: rgba(255,210,74,.08);
    box-shadow: 0 0 12px rgba(255,210,74,.18);
  }
  .msg-item.pinned .m-name { color: var(--gold); }
  /* 置顶标签 */
  .pin-tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px;
    background: var(--gold); color: #1a1b3a; font-weight: bold; margin-right: 6px;
  }
  .msg-item .m-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
  .msg-item .m-name { color: var(--green); font-weight: bold; word-break: break-all; }
  .msg-item .m-time { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
  .msg-item .m-body { color: var(--text); word-break: break-all; white-space: pre-wrap; }
  .msg-empty { color: var(--text-dim); font-size: 13px; padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  @media (max-width: 480px) { .msg-form .msg-row { grid-template-columns: 1fr; } .msg-form .msg-row .btn { width: 100%; } }
</style>
</head>

<header>
  <h1>幻兽帕鲁 配种计算器 v1.1</h1>
  <p>支持变异配种 ｜ 正向：爸爸+妈妈→后代 ｜ 反向：目标帕鲁→父母组合（普通+变异）</p>
</header>

<main>
  <div class="row">
    <!-- ========== 正向查询 ========== -->
    <section class="card fwd">
      <h2><span class="dot"></span>正向配种查询</h2>
      <p class="sub">选择爸爸与妈妈。若命中变异规则则直接显示变异后代，否则用平均值算法</p>
      <div class="field">
        <label>爸爸帕鲁</label>
        <select id="fwdDad"></select>
      </div>
      <div class="field">
        <label>妈妈帕鲁</label>
        <select id="fwdMom"></select>
      </div>
      <button class="btn" id="fwdBtn">查询后代</button>
      <div class="result" id="fwdResult"><div class="empty">请选择父母后点击查询</div></div>
    </section>

    <!-- ========== 反向查询 ========== -->
    <section class="card rev">
      <h2><span class="dot"></span>反向配种查询</h2>
      <p class="sub">选择目标帕鲁，分别列出"变异配种组合"与"普通平均值组合"</p>
      <div class="field">
        <label>目标帕鲁（想要配出的后代）</label>
        <select id="revTarget"></select>
      </div>
      <button class="btn" id="revBtn">查询父母组合</button>
      <div class="result" id="revResult"><div class="empty">请选择目标后点击查询</div></div>
    </section>
  </div>

  <!-- ========== 历史记录 ========== -->
  <section class="card his">
    <div class="his-head">
      <h2><span class="dot"></span>查询历史（本地保存，刷新不丢失）</h2>
      <button class="btn ghost" id="clearHisBtn" style="width:auto; padding:8px 14px; font-size:13px;">清空历史</button>
    </div>
    <div class="his-list" id="hisList"></div>
  </section>

  <!-- ========== 留言板 ========== -->
  <section class="card msg">
    <h2><span class="dot"></span>玩家留言板</h2>
    <p class="sub">分享你的配种心得，留言保存在服务器，刷新页面仍可见</p>
    <div class="msg-form">
      <textarea id="msgContent" placeholder="写下你的留言……（必填）"></textarea>
      <div class="msg-row">
        <input id="msgName" type="text" placeholder="玩家名（可选，留空显示匿名玩家）">
        <button class="btn" id="msgSubmit" style="width:auto; padding:12px 22px;">提交留言</button>
      </div>
      <div class="msg-tip" id="msgTip"></div>
    </div>
    <div class="msg-list" id="msgList"></div>
  </section>
</main>

];

/* ---- 运行时构建完整帕鲁表（基础 + 变异帕鲁）----
 * 变异帕鲁无配种力量值，power=null，mutation=true；
 * 它们可作父母/目标参与变异匹配，但不参与平均值算法。
 */
const ALL_PALS = (function () {
  const map = new Map();
  for (const p of PALS) map.set(p.name, { name: p.name, code: p.code, power: p.power, mutation: false });
  const ensure = (name) => {
    if (!map.has(name)) map.set(name, { name: name, code: null, power: null, mutation: true });
  };
  for (const m of MUTATIONS) { ensure(m.p1); ensure(m.p2); ensure(m.child); }
  return Array.from(map.values());
})();

/* 有力量值的帕鲁（仅这些参与平均值算法的"后代候选"与"父母配对"）*/
const POWERED_PALS = ALL_PALS.filter(p => p.power != null);
/* 名称 -> 帕鲁对象 的查找表 */
const PAL_BY_NAME = new Map(ALL_PALS.map(p => [p.name, p]));

/* =====================================================================
 * 算法区
 * ===================================================================== */

/**
 * 找配种力量最接近 targetPower 的所有（有力量值的）帕鲁。
 * 先求最小差值，再返回所有等于该差值的帕鲁（并列取全部）。
 */
function findClosestPals(targetPower) {
  let minDiff = Infinity;
  for (const p of POWERED_PALS) {
    const diff = Math.abs(p.power - targetPower);
    if (diff < minDiff) minDiff = diff;
  }
  const result = [];
  for (const p of POWERED_PALS) {
    if (Math.abs(p.power - targetPower) === minDiff) result.push(p);
  }
  return result;
}

/**
 * 变异规则匹配：返回所有"父母名匹配（顺序无关、忽略性别）"的变异规则。
 */
function matchMutations(nameA, nameB) {
  const hits = [];
  for (const m of MUTATIONS) {
    if ((m.p1 === nameA && m.p2 === nameB) || (m.p1 === nameB && m.p2 === nameA)) {
      hits.push(m);
    }
  }
  return hits;
}

/**
 * 正向配种：
 * 1) 先查变异规则 → 命中则返回变异后代（可能多条规则多个后代）
 * 2) 未命中且父母都有力量值 → 平均值算法
 * 3) 否则无法用平均值计算
 */
function forwardBreed(dadName, momName) {
  const dad = PAL_BY_NAME.get(dadName);
  const mom = PAL_BY_NAME.get(momName);
  if (!dad || !mom) return { type: "error", reason: "未找到帕鲁" };

  const rules = matchMutations(dadName, momName);
  if (rules.length) {
    // 收集所有变异后代（去重保序）
    const seen = new Set();
    const children = [];
    for (const r of rules) {
      if (!seen.has(r.child)) { seen.add(r.child); children.push(PAL_BY_NAME.get(r.child)); }
    }
    return { type: "mutation", dad, mom, rules, children };
  }

  if (dad.power == null || mom.power == null) {
    return { type: "noavg", dad, mom, reason: "该组合无变异规则，且涉及无配种力量值的变异帕鲁，无法用平均值算法计算" };
  }
  const avg = (dad.power + mom.power) / 2;
  const offspring = findClosestPals(avg);
  return { type: "average", dad, mom, avg, offspring };
}

/**
 * 反向配种：找出所有能产出目标的父母组合
 * - mutCombos：变异规则中 child===目标 的 (p1,p2)
 * - avgCombos：仅当目标有力量值时，遍历有力量值的两两组合，平均值命中目标
 */
function reverseBreed(targetName) {
  const target = PAL_BY_NAME.get(targetName);

  const mutCombos = [];
  for (const m of MUTATIONS) {
    if (m.child === targetName) {
      mutCombos.push({ dad: PAL_BY_NAME.get(m.p1), mom: PAL_BY_NAME.get(m.p2) });
    }
  }

  const avgCombos = [];
  if (target && target.power != null) {
    for (let i = 0; i < POWERED_PALS.length; i++) {
      for (let j = i; j < POWERED_PALS.length; j++) {
        const a = POWERED_PALS[i], b = POWERED_PALS[j];
        const avg = (a.power + b.power) / 2;
        const offspring = findClosestPals(avg);
        if (offspring.some(p => p.name === targetName)) {
          avgCombos.push({ dad: a, mom: b, avg });
        }
      }
    }
  }
  return { target, mutCombos, avgCombos };
}

/* =====================================================================
 * 界面区
 * ===================================================================== */

// 基础帕鲁按力量降序、变异帕鲁按名称排序，便于下拉查找
const BASE_SORTED = PALS.slice().sort((a, b) => b.power - a.power);
const MUT_SORTED = ALL_PALS.filter(p => p.mutation).sort((a, b) => a.name.localeCompare(b.name, "zh"));

// 填充下拉框（基础/变异分组）
function fillSelect(sel, pickFirst) {
  const gBase = document.createElement("optgroup");
  gBase.label = "基础帕鲁（" + BASE_SORTED.length + "）";
  for (const p of BASE_SORTED) {
    const o = document.createElement("option");
    o.value = p.name; o.textContent = p.name + "（" + p.power + "）";
    gBase.appendChild(o);
  }
  const gMut = document.createElement("optgroup");
  gMut.label = "变异帕鲁（" + MUT_SORTED.length + "）";
  for (const p of MUT_SORTED) {
    const o = document.createElement("option");
    o.value = p.name; o.textContent = p.name;
    gMut.appendChild(o);
  }
  sel.appendChild(gBase);
  sel.appendChild(gMut);
}
fillSelect(document.getElementById("fwdDad"));
fillSelect(document.getElementById("fwdMom"));
fillSelect(document.getElementById("revTarget"));

/* ---- 选择记忆：刷新后自动恢复上次选择 ----
 * 原理：选择变化时把值存进 localStorage；页面加载时读出并设回下拉框。
 * 对爸爸/妈妈/目标三个下拉框统一处理，体验一致。
 */
const SEL_KEYS = { fwdDad: "lastDad", fwdMom: "lastMom", revTarget: "lastTarget" };
function restoreSelect(id) {
  const sel = document.getElementById(id);
  const saved = localStorage.getItem(SEL_KEYS[id]);
  if (saved && Array.from(sel.options).some(o => o.value === saved)) {
    sel.value = saved;                 // 恢复上次选择（校验该值仍存在于选项中）
  } else if (id === "fwdMom") {
    sel.selectedIndex = 1;             // 默认妈妈选第二项，便于演示
  }
  // 选择变化时记忆
  sel.onchange = function () { localStorage.setItem(SEL_KEYS[id], sel.value); };
}
restoreSelect("fwdDad");
restoreSelect("fwdMom");
restoreSelect("revTarget");

// 单个帕鲁 chip（变异帕鲁用紫色样式）
function palChip(p) {
  const cls = p.mutation ? "pal-chip mut" : "pal-chip";
  const pw = p.power != null ? p.power : "变异";
  return '<span class="' + cls + '"><span class="name">' + p.name + '</span><span class="pw">' + pw + '</span></span>';
}

// 渲染正向结果
function renderForward(res) {
  const box = document.getElementById("fwdResult");
  if (res.type === "error") { box.innerHTML = '<div class="empty">' + res.reason + "</div>"; return; }

  if (res.type === "mutation") {
    const chips = res.children.map(palChip).join("");
    box.innerHTML =
      '<div class="mut-hit">' +
        '<div class="title">⚡ 变异配种命中！</div>' +
        '<div>父母：<b>' + res.dad.name + '</b> ＋ <b>' + res.mom.name + '</b></div>' +
        '<div style="margin-top:4px;">' + chips + '</div>' +
      '</div>';
    return;
  }

  if (res.type === "noavg") {
    box.innerHTML = '<div class="warn">' + res.reason + "</div>";
    return;
  }

  // average
  const names = res.offspring.map(p => p.name).join(" / ");
  box.innerHTML =
    '<div style="margin-top:6px;">' + res.offspring.map(palChip).join("") + '</div>' +
    '<div class="avg-info">父母平均力量：<b style="color:var(--gold)">' + res.avg + '</b>　命中后代：' + names + '</div>';
}

// 渲染反向结果（变异 / 普通分区）
function renderReverse(res) {
  const box = document.getElementById("revResult");
  if (!res.target) { box.innerHTML = '<div class="empty">未找到目标帕鲁</div>'; return; }

  const tName = res.target.name;
  let html = '<div class="avg-info">目标：<b>' + tName + '</b>' +
    (res.target.power != null ? '（力量 ' + res.target.power + '）' : '（变异帕鲁·无力量值）') + '</div>';

  // —— 变异配种组合 ——
  html += '<div class="section-title" style="color:var(--purple)">⚡ 变异配种组合<span class="cnt">' + res.mutCombos.length + '</span></div>';
  if (res.mutCombos.length === 0) {
    html += '<div class="empty">无变异规则可配出 ' + tName + '</div>';
  } else {
    html += '<div class="combo-list">';
    for (const c of res.mutCombos) {
      html += '<div class="combo mut"><span class="p">' + c.dad.name + '</span><span class="x">＋</span>' +
        '<span class="p">' + c.mom.name + '</span><span class="pw"><span class="badge">变异</span></span></div>';
    }
    html += '</div>';
  }

  // —— 普通配种组合（平均值算法）——
  html += '<div class="section-title" style="color:var(--blue)">普通配种组合（平均值算法）<span class="cnt">' + res.avgCombos.length + '</span></div>';
  if (res.avgCombos.length === 0) {
    html += '<div class="empty">' + (res.target.power != null ? '无平均值组合可配出 ' + tName : '该目标为变异帕鲁，无平均值算法组合') + '</div>';
  } else {
    html += '<div class="combo-list">';
    for (const c of res.avgCombos) {
      html += '<div class="combo"><span class="p">' + c.dad.name + '</span><span class="x">＋</span>' +
        '<span class="p">' + c.mom.name + '</span><span class="pw">均值 ' + c.avg + '</span></div>';
    }
    html += '</div>';
  }

  box.innerHTML = html;
}

/* =====================================================================
 * 历史记录区：localStorage 增删查
 * ===================================================================== */
const HIS_KEY = "pal_breeding_history_v1";

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HIS_KEY)) || []; }
  catch { return []; }
}
function saveHistory(list) {
  localStorage.setItem(HIS_KEY, JSON.stringify(list));
}
function addHistory(item) {
  const list = loadHistory();
  list.unshift(item);
  if (list.length > 100) list.length = 100;
  saveHistory(list);
  renderHistory();
}
function renderHistory() {
  const list = loadHistory();
  const box = document.getElementById("hisList");
  if (list.length === 0) { box.innerHTML = '<div class="empty">暂无历史记录</div>'; return; }
  box.innerHTML = list.map(function (it) {
    if (it.type === "fwd") {
      const mutTag = it.mode === "mutation" ? ' <span class="tag mut">变异</span>' : "";
      return '<div class="his-item"><span class="tag fwd">正向</span>' + mutTag +
        it.dad + " ＋ " + it.mom + " → <span class=\"res\">" + it.result + "</span>" +
        '<span class="time">' + it.time + "</span></div>";
    } else {
      return '<div class="his-item"><span class="tag rev">反向</span>目标：' + it.target +
        "，变异 <span class=\"res\">" + it.mutCount + "</span> / 普通 <span class=\"res\">" + it.avgCount + "</span>" +
        '<span class="time">' + it.time + "</span></div>";
    }
  }).join("");
}

/* =====================================================================
 * 事件绑定
 * ===================================================================== */
function nowStr() {
  const d = new Date();
  const p = function (n) { return String(n).padStart(2, "0"); };
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

// 正向查询
document.getElementById("fwdBtn").addEventListener("click", function () {
  const dadName = document.getElementById("fwdDad").value;
  const momName = document.getElementById("fwdMom").value;
  const res = forwardBreed(dadName, momName);
  renderForward(res);
  if (res.type === "mutation" || res.type === "average") {
    addHistory({
      type: "fwd",
      mode: res.type === "mutation" ? "mutation" : "average",
      dad: res.dad.name,
      mom: res.mom.name,
      result: (res.type === "mutation" ? res.children : res.offspring).map(function (p) { return p.name; }).join(" / "),
      time: nowStr()
    });
  }
});

// 反向查询
document.getElementById("revBtn").addEventListener("click", function () {
  const targetName = document.getElementById("revTarget").value;
  const res = reverseBreed(targetName);
  renderReverse(res);
  addHistory({
    type: "rev",
    target: targetName,
    mutCount: res.mutCombos.length,
    avgCount: res.avgCombos.length,
    time: nowStr()
  });
});

// 清空历史
document.getElementById("clearHisBtn").addEventListener("click", function () {
  if (!confirm("确定要清空全部历史记录吗？")) return;
  saveHistory([]);
  renderHistory();
});

// 初次渲染历史
renderHistory();

/* =====================================================================
 * 留言板模块（与后端 http://127.0.0.1:8000 交互）
 *   GET  /messages  -> 读取留言列表
 *   POST /messages  -> 提交新留言（JSON: {name, content}）
 * ===================================================================== */
var MSG_API = "http://127.0.0.1:8000";

// HTML 转义，避免留言内容导致注入
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// 格式化留言时间，兼容 ISO 字符串与时间戳
function fmtMsgTime(t) {
  if (!t) return "";
  var d = new Date(t);
  if (isNaN(d.getTime())) return String(t);
  var pad = function (n) { return n < 10 ? "0" + n : n; };
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
    " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

// 渲染留言列表到页面
function renderMessages(list) {
  var box = document.getElementById("msgList");
  if (!Array.isArray(list) || list.length === 0) {
    box.innerHTML = '<div class="msg-empty">还没有留言，快来抢沙发吧~</div>';
    return;
  }
  var html = "";
  list.forEach(function (m) {
    // 兼容多种字段命名
    var name = m.name || m.nickname || m.user || "";
    var content = m.content || m.message || m.text || "";
    var time = m.time || m.created_at || m.createdAt || m.timestamp || "";
    // 读取置顶字段，兼容不同命名
    var isPinned = !!(m.isPinned || m.is_pinned || m.pinned);
    if (!String(name).trim()) name = "匿名玩家";
    // 置顶留言添加 pinned class 和置顶标签
    var itemCls = "msg-item" + (isPinned ? " pinned" : "");
    var pinTag = isPinned ? '<span class="pin-tag">置顶</span>' : "";
    html += '<div class="' + itemCls + '">' +
      '<div class="m-head"><span class="m-name">' + pinTag + escapeHtml(name) +
      '</span><span class="m-time">' + escapeHtml(fmtMsgTime(time)) + '</span></div>' +
      '<div class="m-body">' + escapeHtml(content) + '</div>' +
      '</div>';
  });
  box.innerHTML = html;
}

// 在提示行显示文字（type: "" | "err" | "ok"）
function showMsgTip(text, type) {
  var tip = document.getElementById("msgTip");
  tip.textContent = text || "";
  tip.className = "msg-tip" + (type ? " " + type : "");
}

// 从后端拉取留言
function loadMessages() {
  fetch(MSG_API + "/messages", { method: "GET" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      // 兼容后端返回数组 或 {messages:[...]} 两种结构
      var list = Array.isArray(data) ? data : (data && data.messages) || [];
      renderMessages(list);
    })
    .catch(function (err) {
      showMsgTip("加载留言失败：" + err.message + "（请确认后端已启动）", "err");
      renderMessages([]);
    });
}

// 提交留言
document.getElementById("msgSubmit").addEventListener("click", function () {
  var contentEl = document.getElementById("msgContent");
  var nameEl = document.getElementById("msgName");
  var content = contentEl.value.trim();
  var name = nameEl.value.trim();
  // 留言内容为空时提示用户，不发送
  if (!content) {
    showMsgTip("留言内容不能为空哦~", "err");
    contentEl.focus();
    return;
  }
  showMsgTip("正在提交……", "");
  fetch(MSG_API + "/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: name, text: content })
  })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function () {
      // 提交成功：清空输入框并刷新留言列表
      contentEl.value = "";
      showMsgTip("留言提交成功！", "ok");
      loadMessages();
    })
    .catch(function (err) {
      showMsgTip("提交失败：" + err.message + "（请确认后端已启动）", "err");
    });
});

// 页面打开时自动加载留言
loadMessages();
</script>
